[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv2-helper"
dynamic = ["version"]
readme = "README.md"
description = "Helper Module for OpenCV"
authors = [
    { name = "Pedro Mayorga", email = "ppmayorga80@gmail.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.5",
    "PySide6>=6.5"
]

[project.optional-dependencies]
dev = [
    "pylint>=4.1",
    "pdoc>=16.0",
    "python-semantic-release>=10.7",
    "build",
    "twine"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv2_helper = ["assets/*", "assets/**/*"]

[tool.setuptools.dynamic]
version = {attr = "cv2_helper.__version__"}

[tool.semantic_release]
version_variables = [
    "src/cv2_helper/__init__.py:__version__"
]
build_command = "pip install build && python -m build"

[tool.semantic_release.publish]
upload_to_pypi = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"