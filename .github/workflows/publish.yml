name: Release and Publish

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint numpy opencv-python python-semantic-release build twine

      - name: Run Pylint Code Quality Validation
        run: |
          # Block release pipeline if Pylint score is below 10.0
          pylint --fail-under=10.0 cv2_helper

      - name: Run Semantic Release and Publish to PyPI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semantic-release version
          semantic-release publish
          twine upload dist/* --skip-existing